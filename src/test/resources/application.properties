# Replaces src/main/resources/application.properties on the test classpath.
# Do not import that file. Tests must not fall through to its datasource default.
spring.application.name=fossiles-core-backend

spring.datasource.url=jdbc:h2:mem:fossiles_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

sentry.enabled=false
sentry.dsn=
sentry.logs.enabled=false
sentry.traces-sample-rate=0

jwt.secret=test-only-jwt-secret-32-characters!
jwt.expiration=86400000
encryption.key=test-only-encryption-key-32chars
encryption.algorithm=AES
encryption.transformation=AES/CBC/PKCS5Padding

app.s3.enabled=false

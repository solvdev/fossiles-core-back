# Test-only configuration. It shadows src/main/resources/application.properties on the test
# classpath, so no production value is ever read by a test. Every external integration is
# disabled or pointed at a non-routable dummy value.

spring.application.name=fossiles-core-backend-test

# Database: in-memory H2, schema generated from the entities
spring.datasource.url=jdbc:h2:mem:fossiles_test;MODE=PostgreSQL;NON_KEYWORDS=YEAR,MONTH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Sentry
sentry.enabled=false
sentry.dsn=

# S3 (also removes any dependency on AWS_* environment credentials)
app.s3.enabled=false
app.s3.bucket=test-bucket
app.s3.prefix=test/
app.s3.region=us-east-1
app.s3.access-key-id=dummy
app.s3.secret-access-key=dummy

# FEL (INFILE): disabled, URLs point at a closed local port
fel.receptor.enabled=false
fel.receptor.url=http://localhost:1/fel-receptor
fel.receptor.emisor-codigo=dummy
fel.receptor.emisor-clave=dummy
fel.emission.enabled=false
fel.emission.test-mode=true
fel.emission.required=false
fel.emission.sign-url=http://localhost:1/fel-sign
fel.emission.certify-url=http://localhost:1/fel-certify
fel.emission.annul-url=http://localhost:1/fel-annul

# Mail has no spring.mail.* settings: EmailService builds its sender from DB rows,
# and the in-memory H2 database starts empty.

# Security and encryption: dummy values, never valid outside tests
jwt.secret=test-only-jwt-secret-with-at-least-32-bytes-0000
jwt.expiration=3600000
jwt.refresh-expiration=7200000
encryption.key=test-only-encryption-key
encryption.algorithm=AES
encryption.transformation=AES/CBC/PKCS5Padding

app.frontend.url=http://localhost:3000

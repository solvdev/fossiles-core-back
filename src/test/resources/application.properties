# Replaces src/main/resources/application.properties on the test classpath.
# Do not import the main file. The datasource below is the only database tests use.
spring.application.name=fossiles-core-backend

spring.datasource.url=jdbc:h2:mem:fossiles_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

server.port=8080

sentry.enabled=false
sentry.dsn=
sentry.logs.enabled=false
sentry.traces-sample-rate=0

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.jdbc.core=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

jwt.secret=${JWT_SECRET:CHANGE_ME}
jwt.expiration=86400000
jwt.refresh-expiration=7776000000

encryption.key=${ENCRYPTION_KEY:CHANGE_ME}
encryption.algorithm=AES
encryption.transformation=AES/CBC/PKCS5Padding

app.s3.bucket=fossilesbkt
app.s3.prefix=materiales/
app.s3.region=us-east-2
app.s3.access-key-id=${AWS_ACCESS_KEY_ID:CHANGE_ME}
app.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:CHANGE_ME}

app.frontend.url=${FRONTEND_URL:https://core.fossilescorp.com}


# Replaces src/main/resources/application.properties on the test classpath.
# Sentry is off. The datasource is in-memory H2. Stand-in values are not production secrets.
sentry.enabled=false
sentry.dsn=
spring.datasource.url=jdbc:h2:mem:fossiles;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
jwt.secret=test-only-jwt-secret-not-used-in-production-00
jwt.expiration=3600000
encryption.key=test-only-encryption-key-32chars!!
encryption.algorithm=AES
encryption.transformation=AES/CBC/PKCS5Padding
fel.receptor.enabled=false
fel.emission.enabled=false
app.s3.enabled=false

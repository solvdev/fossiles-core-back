spring.application.name=fossiles-core-backend

# Database Configuration (AWS RDS)
#spring.datasource.url=jdbc:postgresql://fossiles-gt.czaiugi22fpp.us-east-2.rds.amazonaws.com:5432/fossilesgt
spring.datasource.url=jdbc:postgresql://fossiles-gt.czaiugi22fpp.us-east-2.rds.amazonaws.com:5432/fosstest
spring.datasource.username=fossilesadmin
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Batch Insert Configuration (Optimización para inserts masivos)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Server Configuration
server.port=8080

# Logging
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.jdbc.core=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF 

# JWT Configuration
jwt.secret=${JWT_SECRET:CHANGE_ME}
jwt.expiration=86400000
jwt.refresh-expiration=7776000000

# Encryption Configuration (AES)
# IMPORTANTE: Esta clave debe ser EXACTAMENTE la misma que ENCRYPTION_KEY en encryptionService.js del frontend
encryption.key=${ENCRYPTION_KEY:CHANGE_ME}
encryption.algorithm=AES
encryption.transformation=AES/CBC/PKCS5Padding

# S3 Uploads (configurar)
app.s3.bucket=fossilesbkt
app.s3.prefix=materiales/
app.s3.region=us-east-2
app.s3.access-key-id=${AWS_ACCESS_KEY_ID:CHANGE_ME}
app.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:CHANGE_ME}

# Frontend URL (para generar URLs en QR codes y stickers)
# Cambiar esta URL por la URL pública de producción cuando se despliegue
app.frontend.url=${FRONTEND_URL:https://core.fossilescorp.com}


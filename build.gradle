plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.8'
    id 'io.spring.dependency-management' version '1.1.7'
    id "io.sentry.jvm.gradle" version "6.19.0"
}

group = 'com.fossiles'
version = ''
description = 'fossiles-core-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

sentry {
    // Generates a JVM (Java, Kotlin, etc.) source bundle and uploads your source code to Sentry.
    // This enables source context, allowing you to see your source
    // code as part of your stack traces in Sentry.
    includeSourceContext = true

    org = "solv-73"
    projectName = "java-spring-boot"
    authToken = System.getenv("SENTRY_AUTH_TOKEN")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'io.sentry:sentry-async-profiler:8.53.0'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'software.amazon.awssdk:s3:2.27.18'
    implementation 'org.apache.poi:poi-ooxml:5.4.0'
    implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20261011.1'
    // JWT dependencies
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def resolveTestDatasourceUrl() {
    def propsFile = file('src/test/resources/application.properties')
    if (!propsFile.isFile()) {
        throw new GradleException('Refusing to run tests: src/test/resources/application.properties is missing.')
    }
    def text = propsFile.getText('UTF-8')
    if (text.contains('spring.config.import')) {
        throw new GradleException('Refusing to run tests: test application.properties must not import another config.')
    }
    def lowered = text.toLowerCase(Locale.ROOT)
    if (lowered.contains('rds.amazonaws.com') || lowered.contains('jdbc:postgresql')) {
        throw new GradleException('Refusing to run tests: test application.properties points at a remote database.')
    }
    String url = null
    text.readLines().each { line ->
        def trimmed = line.trim()
        if (trimmed.isEmpty() || trimmed.startsWith('#')) {
            return
        }
        def key = 'spring.datasource.url='
        if (trimmed.startsWith(key)) {
            url = trimmed.substring(key.length()).trim()
        }
    }
    if (url == null || url.isEmpty()) {
        throw new GradleException('Refusing to run tests: test application.properties has no spring.datasource.url.')
    }
    def envUrl = System.getenv('SPRING_DATASOURCE_URL')
    if (envUrl != null && !envUrl.trim().isEmpty()) {
        url = envUrl.trim()
    }
    return url
}

tasks.named('test') {
    useJUnitPlatform()
    // -Dsentry.* on the Gradle command is the Gradle JVM only. Forward it into
    // the test worker, and default to off so a run cannot report to production.
    systemProperty 'sentry.enabled', System.getProperty('sentry.enabled', 'false')
    systemProperty 'sentry.dsn', System.getProperty('sentry.dsn', '')
    environment 'SPRING_DATASOURCE_URL', 'jdbc:h2:mem:fossiles;MODE=PostgreSQL;DB_CLOSE_DELAY=-1'
    environment 'SENTRY_DSN', ''
    doFirst {
        def fromEnv = System.getenv('SPRING_DATASOURCE_URL')
        def resolved = (fromEnv != null && !fromEnv.isBlank()) ? fromEnv : testResourceDatasourceUrl()
        if (resolved == null || !resolved.startsWith('jdbc:h2:mem')) {
            throw new GradleException(
                    'Refusing to run tests: datasource URL must start with jdbc:h2:mem')
        }
        logger.lifecycle('Test datasource URL: ' + resolved)
    }
}

// Version metadata is packaged only into the boot jar. Keeping it off the main
// resource output leaves tests on the dev/unknown fallback and does not rebuild
// every test when build.time changes. The jar name stays fossiles-core-backend.jar.
def generatedAppInfo = layout.buildDirectory.dir('generated/app-info')

springBoot {
    buildInfo {
        destinationDir.set(generatedAppInfo.map { it.dir('META-INF') })
    }
}

tasks.named('classes').configure { classesTask ->
    classesTask.setDependsOn(classesTask.getDependsOn().findAll { dependency ->
        !dependency.toString().contains('bootBuildInfo')
    })
}

tasks.named('bootBuildInfo').configure {
    properties { info ->
        info.version.set(providers.provider { resolveReleaseVersion() })
        info.additional.set(providers.provider { ['commit': resolveGitCommit()] })
    }
}

tasks.register('writeGitProperties') {
    def propsFile = generatedAppInfo.map { it.file('git.properties') }
    inputs.property('commit', providers.provider { resolveGitCommit() })
    outputs.file(propsFile)
    doLast {
        def props = propsFile.get().asFile
        props.parentFile.mkdirs()
        props.setText('git.commit.id.abbrev=' + resolveGitCommit() + '\n', 'UTF-8')
    }
}

tasks.named('bootJar').configure {
    dependsOn tasks.named('bootBuildInfo'), tasks.named('writeGitProperties')
    classpath = classpath.plus(files(generatedAppInfo))
}

String runNextVersionScript() {
    def script = file('.github/scripts/next-version.sh')
    if (!script.isFile()) {
        logger.warn('next-version.sh is missing; using dev')
        return null
    }
    try {
        def processBuilder = new ProcessBuilder('bash', script.absolutePath)
        processBuilder.directory(rootDir)
        processBuilder.environment().put('GIT_TERMINAL_PROMPT', '0')
        def process = processBuilder.start()
        def output = new StringBuilder()
        def errors = new StringBuilder()
        process.consumeProcessOutput(output, errors)
        if (!process.waitFor(180, java.util.concurrent.TimeUnit.SECONDS)) {
            process.destroyForcibly()
            logger.warn('next-version.sh timed out; using dev')
            return null
        }
        if (process.exitValue() != 0) {
            def message = errors.toString().trim()
            logger.warn('next-version.sh exited ' + process.exitValue()
                    + (message.isEmpty() ? '; using dev' : ': ' + message))
            return null
        }
        def tag = output.toString().trim()
        if (tag.isEmpty()) {
            logger.warn('next-version.sh printed no tag; using dev')
            return null
        }
        return tag
    } catch (Exception ex) {
        logger.warn('next-version.sh could not be run; using dev: ' + ex.message)
        return null
    }
}

String normalizeVersion(String raw) {
    if (raw == null) {
        return 'dev'
    }
    def trimmed = raw.trim()
    if (trimmed.startsWith('v') || trimmed.startsWith('V')) {
        trimmed = trimmed.substring(1)
    }
    return trimmed ==~ /\d+\.\d+\.\d+(-rc\.\d+)?/ ? trimmed : 'dev'
}

String normalizeCommit(String raw) {
    if (raw == null) {
        return 'unknown'
    }
    def trimmed = raw.trim()
    if (!(trimmed ==~ /[0-9a-fA-F]{7,64}/)) {
        return 'unknown'
    }
    return trimmed.substring(0, 7).toLowerCase(java.util.Locale.ROOT)
}

String resolveReleaseVersion() {
    try {
        def forced = System.getenv('APP_VERSION')
        if (forced == null || forced.isBlank()) {
            forced = gradle.startParameter.projectProperties.get('version')
        }
        if (forced != null && !forced.isBlank()) {
            return normalizeVersion(forced)
        }
        return normalizeVersion(runNextVersionScript())
    } catch (Exception ex) {
        logger.warn('Version computation failed, using dev: ' + ex.message)
        return 'dev'
    }
}

String resolveGitCommit() {
    try {
        def raw = System.getenv('GIT_COMMIT')
        if (raw == null || raw.isBlank()) {
            raw = System.getenv('GITHUB_SHA')
        }
        if (raw != null && !raw.isBlank()) {
            def normalized = normalizeCommit(raw)
            if (normalized != 'unknown') {
                return normalized
            }
        }
        def processBuilder = new ProcessBuilder('git', 'rev-parse', 'HEAD')
        processBuilder.directory(rootDir)
        def process = processBuilder.start()
        def output = new StringBuilder()
        def errors = new StringBuilder()
        process.consumeProcessOutput(output, errors)
        if (!process.waitFor(15, java.util.concurrent.TimeUnit.SECONDS)) {
            process.destroyForcibly()
            return 'unknown'
        }
        if (process.exitValue() != 0) {
            logger.warn('git rev-parse failed, using unknown: ' + errors.toString().trim())
            return 'unknown'
        }
        return normalizeCommit(output.toString())
    } catch (Exception ex) {
        logger.warn('Commit lookup failed, using unknown: ' + ex.message)
        return 'unknown'
    }
}

def testResourceDatasourceUrl() {
    def props = new java.util.Properties()
    file('src/test/resources/application.properties').withInputStream { props.load(it) }
    return props.getProperty('spring.datasource.url')
}

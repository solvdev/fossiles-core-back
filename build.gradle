plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.8'
    id 'io.spring.dependency-management' version '1.1.7'
    id "io.sentry.jvm.gradle" version "6.19.0"
}

group = 'com.fossiles'
version = ''
description = 'fossiles-core-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

sentry {
    // Generates a JVM (Java, Kotlin, etc.) source bundle and uploads your source code to Sentry.
    // This enables source context, allowing you to see your source
    // code as part of your stack traces in Sentry.
    includeSourceContext = true

    org = "solv-73"
    projectName = "java-spring-boot"
    authToken = System.getenv("SENTRY_AUTH_TOKEN")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'io.sentry:sentry-async-profiler:8.53.0'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'software.amazon.awssdk:s3:2.27.18'
    implementation 'org.apache.poi:poi-ooxml:5.4.0'
    // JWT dependencies
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def testH2Url = 'jdbc:h2:mem:fossiles_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE'
def mainResourcesForTest = layout.buildDirectory.dir('resources/main-for-test')

tasks.register('mainResourcesForTest', Copy) {
    dependsOn tasks.named('processResources')
    from(layout.buildDirectory.dir('resources/main')) {
        exclude 'application.properties'
    }
    into mainResourcesForTest
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn 'mainResourcesForTest'
    environment 'SPRING_DATASOURCE_URL', testH2Url
    environment 'SENTRY_DSN', ''
    def mainResources = layout.buildDirectory.dir('resources/main')
    classpath = files(mainResourcesForTest) + classpath.filter { File entry ->
        entry != mainResources.get().asFile
    }
    doFirst {
        def allowed = layout.buildDirectory.file('resources/test/application.properties').get().asFile.canonicalFile
        def found = []
        classpath.files.each { File entry ->
            if (entry.isDirectory()) {
                def candidate = new File(entry, 'application.properties')
                if (candidate.isFile()) {
                    found << candidate.canonicalFile
                }
            } else if (entry.name == 'application.properties' && entry.isFile()) {
                found << entry.canonicalFile
            }
        }
        def unexpected = found.findAll { it != allowed }
        if (!allowed.isFile() || unexpected) {
            throw new GradleException(
                    "Test classpath must contain only ${allowed} as application.properties, found ${found}")
        }
        logger.lifecycle('Test classpath application.properties: ' + allowed)
    }
}

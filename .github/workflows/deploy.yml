name: Deploy Backend

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      aviso_minutos:
        description: "Minutos de aviso de reinicio a los usuarios (0 = sin cuenta regresiva)"
        required: false
        default: ""

concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Marcar inicio
        run: echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # main → BACK_HOST (prod). develop → BACK_HOST_TEST (otro EC2).
      # Las IPs se ponen en GitHub → Settings → Secrets and variables → Actions.
      - name: Resolver servidor destino
        id: target
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = "develop" ]; then
            HOST="${{ secrets.BACK_HOST_TEST }}"
            LABEL="test"
          else
            HOST="${{ secrets.BACK_HOST }}"
            LABEL="prod"
          fi
          if [ -z "$HOST" ]; then
            echo "ERROR: Falta el secret de host para la rama ${{ github.ref_name }}."
            echo "Crea BACK_HOST (main) o BACK_HOST_TEST (develop) en Settings → Secrets."
            exit 1
          fi
          RDS_HOST="fossiles-gt.czaiugi22fpp.us-east-2.rds.amazonaws.com"
          if [ "${{ github.ref_name }}" = "develop" ]; then
            DB_NAME="fosstest"
          else
            DB_NAME="fossilesgt"
          fi
          DB_URL="jdbc:postgresql://${RDS_HOST}:5432/${DB_NAME}"
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          echo "ENV_LABEL=$LABEL" >> "$GITHUB_ENV"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"

          # Minutos de aviso a los usuarios antes de detener el servicio. Se pueden cambiar con las
          # variables AVISO_MINUTOS_PROD / AVISO_MINUTOS_TEST o al correrlo a mano (workflow_dispatch).
          AVISO_MIN="${{ github.event.inputs.aviso_minutos }}"
          if [ -z "$AVISO_MIN" ]; then
            if [ "$LABEL" = "test" ]; then AVISO_MIN="${{ vars.AVISO_MINUTOS_TEST || '1' }}"; else AVISO_MIN="${{ vars.AVISO_MINUTOS_PROD || '3' }}"; fi
          fi
          AVISO_MIN=$(printf '%s' "$AVISO_MIN" | tr -cd '0-9'); [ -z "$AVISO_MIN" ] && AVISO_MIN=0
          echo "AVISO_MIN=$AVISO_MIN" >> "$GITHUB_ENV"
          echo "BACK_LOCAL_URL=${{ vars.BACK_LOCAL_URL || 'http://localhost:8080' }}" >> "$GITHUB_ENV"
          echo "Rama ${{ github.ref_name }} → $LABEL ($HOST) db=${DB_NAME}" | tee -a /tmp/deploy.log

      - name: Setup SSH key
        id: ssh_setup
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 1) El servidor tiene que contestar en el puerto 22. Se reintenta porque una instancia
          #    recién encendida o con red lenta tarda en responder; el motivo queda en el log y en
          #    el aviso de Discord (antes solo salía "exit code 1" sin decir por qué).
          ok=0
          for intento in 1 2 3 4 5; do
            echo "Intento $intento/5: ssh-keyscan ${HOST}:22" | tee -a /tmp/deploy.log
            if ssh-keyscan -T 10 -H "$HOST" > /tmp/keyscan.out 2> /tmp/keyscan.err && [ -s /tmp/keyscan.out ]; then
              cat /tmp/keyscan.out >> ~/.ssh/known_hosts
              ok=1
              break
            fi
            echo "  sin respuesta: $(tr '\n' ' ' < /tmp/keyscan.err)" | tee -a /tmp/deploy.log
            sleep $((intento * 5))
          done
          if [ "$ok" != 1 ]; then
            {
              echo "ERROR: el servidor ${ENV_LABEL} no responde por SSH (puerto 22) tras 5 intentos."
              if timeout 10 bash -c "exec 3<>/dev/tcp/${HOST}/22" 2>/dev/null; then
                echo "  El puerto 22 abre, pero ssh-keyscan no obtuvo la llave del servidor."
              else
                echo "  No se pudo abrir una conexión al puerto 22 (apagado, IP distinta o cerrado en el grupo de seguridad)."
              fi
              echo "  Revise en AWS: 1) la instancia está encendida, 2) su IP pública es la del secret"
              echo "  BACK_HOST_TEST/BACK_HOST (cambia al apagar/encender si no es IP elástica),"
              echo "  3) el grupo de seguridad permite el puerto 22 desde las IPs de GitHub."
            } | tee -a /tmp/deploy.log
            exit 1
          fi

          # 2) La llave y el usuario tienen que entrar; así un "Permission denied" sale aquí y no
          #    en «Detener servicio» con el JAR ya compilado.
          if ! ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
                "${SSH_USER}@${HOST}" 'echo conexion-ok' 2>&1 | tee -a /tmp/deploy.log; then
            echo "ERROR: el servidor contesta pero rechazó la llave SSH_PRIVATE_KEY o el usuario SSH_USER." | tee -a /tmp/deploy.log
            exit 1
          fi
          echo "SSH key lista (${ENV_LABEL} ${HOST})" | tee -a /tmp/deploy.log

      # Aviso con cuenta regresiva en las pantallas (o reutiliza el que ya lanzó un admin).
      # El build corre mientras tanto y «Esperar fin del aviso» detiene el servicio al llegar a 0.
      # Si el back todavía no tiene el gancho o falta DEPLOY_HOOK_TOKEN, el deploy sigue sin aviso.
      - name: Avisar reinicio a los usuarios
        id: announce
        continue-on-error: true
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
        run: |
          set -uo pipefail
          OUT=$(bash .github/scripts/deploy-hook.sh ANNOUNCE "$AVISO_MIN")
          CODE=$(printf '%s\n' "$OUT" | head -1)
          BODY=$(printf '%s\n' "$OUT" | tail -n +2)
          case "$CODE" in
            200)
              REM=$(printf '%s' "$BODY" | jq -r '(((.expiresAtEpochMs // 0) - (.serverNowEpochMs // 0)) / 1000) | floor')
              echo "AVISO_ACTIVO=true" >> "$GITHUB_ENV"
              echo "Aviso activo: $(printf '%s' "$BODY" | jq -r '.title') — faltan ${REM}s" | tee -a /tmp/deploy.log ;;
            204) echo "Sin aviso (AVISO_MIN=${AVISO_MIN})" | tee -a /tmp/deploy.log ;;
            000) echo "Sin aviso: falta el secret DEPLOY_HOOK_TOKEN o el back no contesta" | tee -a /tmp/deploy.log ;;
            *)   echo "Sin aviso: el gancho respondió ${CODE} (back sin gancho todavía o token distinto)" | tee -a /tmp/deploy.log ;;
          esac

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Importante: pipefail. Sin eso, `cmd | tee` reporta éxito aunque cmd falle
      # (Gradle compile error → Discord "Deploy exitoso" con JAR viejo en el server).
      - name: Build JAR (bootJar, sin tests)
        id: build
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test 2>&1 | tee -a /tmp/deploy.log
          test -f build/libs/fossiles-core-backend.jar
          echo "JAR OK: $(ls -lh build/libs/fossiles-core-backend.jar)"

      # Espera a que la cuenta regresiva llegue a 0 (el tiempo lo da el servidor, no el reloj del runner).
      # Si un admin cancela el aviso desde la pantalla, el deploy se detiene sin tocar el servidor.
      - name: Esperar fin del aviso
        id: wait_notice
        if: env.AVISO_ACTIVO == 'true'
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
        run: |
          set -uo pipefail
          LIMITE=$(( $(date +%s) + 130 * 60 ))
          FIN=0
          while [ "$(date +%s)" -lt "$LIMITE" ]; do
            OUT=$(bash .github/scripts/deploy-hook.sh STATUS)
            CODE=$(printf '%s\n' "$OUT" | head -1)
            BODY=$(printf '%s\n' "$OUT" | tail -n +2)
            if [ "$CODE" = "200" ]; then
              REM=$(printf '%s' "$BODY" | jq -r '(((.expiresAtEpochMs // 0) - (.serverNowEpochMs // 0)) / 1000) | floor')
              FIN=$(( $(date +%s) + REM ))
              if [ "$REM" -le 0 ]; then break; fi
              echo "Faltan ${REM}s para reiniciar"
              sleep $(( REM < 15 ? REM : 15 ))
            elif [ "$CODE" = "204" ]; then
              # 204 justo al vencer = terminó normal; antes de tiempo = lo cancelaron
              if [ "$FIN" -gt 0 ] && [ "$(date +%s)" -ge $(( FIN - 3 )) ]; then break; fi
              echo "::error::Un administrador canceló el aviso de reinicio. El deploy se detuvo sin tocar el servidor; vuelva a correrlo cuando convenga." | tee -a /tmp/deploy.log
              exit 1
            else
              echo "El gancho respondió ${CODE}; reintento en 15s"
              sleep 15
            fi
          done
          echo "Cuenta regresiva terminada, se reinicia" | tee -a /tmp/deploy.log

      - name: Detener servicio antes de transferir
        id: stop_service
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
        run: |
          set -euo pipefail
          # Las pantallas pasan a «Reiniciando…» y se quedan así hasta que el back nuevo conteste
          echo "Gancho RESTARTING: $(bash .github/scripts/deploy-hook.sh RESTARTING | head -1)" | tee -a /tmp/deploy.log
          sleep 2
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ env.HOST }} \
            "sudo systemctl stop fossiles-core-backend.service" 2>&1 | tee -a /tmp/deploy.log

      - name: Transferir JAR (rsync)
        id: transfer
        run: |
          set -euo pipefail
          test -f build/libs/fossiles-core-backend.jar
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            build/libs/fossiles-core-backend.jar \
            ${{ secrets.SSH_USER }}@${{ env.HOST }}:/backs/fossiles-core-backend.jar \
            2>&1 | tee -a /tmp/deploy.log

      - name: Fijar base de datos del ambiente
        id: datasource
        env:
          DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
        run: |
          set -euo pipefail
          # Token del gancho de avisos (lo lee el back como variable de entorno DEPLOY_HOOK_TOKEN)
          if [ -n "${DEPLOY_HOOK_TOKEN:-}" ]; then
            printf '%s\n' '[Service]' "Environment=DEPLOY_HOOK_TOKEN=${DEPLOY_HOOK_TOKEN}" | \
              ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ env.HOST }} \
                "sudo mkdir -p /etc/systemd/system/fossiles-core-backend.service.d && \
                 sudo tee /etc/systemd/system/fossiles-core-backend.service.d/deploy-hook.conf >/dev/null && \
                 sudo chmod 600 /etc/systemd/system/fossiles-core-backend.service.d/deploy-hook.conf"
            echo "Token del gancho de avisos instalado" | tee -a /tmp/deploy.log
          fi
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ env.HOST }} \
            "sudo mkdir -p /etc/systemd/system/fossiles-core-backend.service.d && \
             printf '%s\n' '[Service]' 'Environment=SPRING_DATASOURCE_URL=${{ env.DB_URL }}' | \
             sudo tee /etc/systemd/system/fossiles-core-backend.service.d/datasource.conf >/dev/null && \
             sudo systemctl daemon-reload" 2>&1 | tee -a /tmp/deploy.log
          echo "Datasource ${{ env.ENV_LABEL }} → ${{ env.DB_URL }}" | tee -a /tmp/deploy.log

      - name: Iniciar servicio
        id: start_service
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ env.HOST }} \
            "sudo systemctl start fossiles-core-backend.service" 2>&1 | tee -a /tmp/deploy.log

      - name: Verificar estado del servicio
        id: verify
        run: |
          set -euo pipefail
          {
            # «active» en systemd solo dice que el proceso Java existe; /ping contesta cuando Spring
            # ya terminó de arrancar (es lo mismo que espera el banner para decir «Sistema actualizado»).
            LISTO=false
            for i in $(seq 1 36); do
              sleep 5
              CODE=$(ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ env.HOST }} \
                "curl -s -m 5 -o /dev/null -w '%{http_code}' '${BACK_LOCAL_URL}/api/system-announcements/ping'" || true)
              if [ "$CODE" = "200" ]; then
                LISTO=true
                echo "Back respondiendo tras $(( i * 5 ))s"
                break
              fi
            done
            STATUS=$(ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ env.HOST }} \
              "systemctl is-active fossiles-core-backend.service || true")
            echo "Estado: $STATUS"
            if [ "$STATUS" != "active" ]; then
              echo "::error::El servicio no quedó activo, mostrando ultimos logs"
              ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ env.HOST }} \
                "sudo journalctl -u fossiles-core-backend.service -n 500 --no-pager"
              exit 1
            fi
            if [ "$LISTO" != true ]; then
              echo "::warning::El servicio está activo pero /ping no contestó en 3 min (revise la variable BACK_LOCAL_URL)"
            fi
          } 2>&1 | tee -a /tmp/deploy.log

      - name: Notificar en Discord
        if: always()
        continue-on-error: true
        run: |
          DURATION=$(( $(date +%s) - ${DEPLOY_START:-$(date +%s)} ))
          MIN=$(( DURATION / 60 )); SEC=$(( DURATION % 60 ))

          # job.status + outcomes de cada paso (por si algún step se marca raro)
          BUILD_OUT="${{ steps.build.outcome }}"
          SSH_OUT="${{ steps.ssh_setup.outcome }}"
          WAIT_OUT="${{ steps.wait_notice.outcome }}"
          STOP_OUT="${{ steps.stop_service.outcome }}"
          TRANSFER_OUT="${{ steps.transfer.outcome }}"
          DS_OUT="${{ steps.datasource.outcome }}"
          START_OUT="${{ steps.start_service.outcome }}"
          VERIFY_OUT="${{ steps.verify.outcome }}"

          DEPLOY_OK=true
          PASO_FALLIDO="-"
          for par in \
            "Build JAR:$BUILD_OUT" \
            "Setup SSH:$SSH_OUT" \
            "Esperar aviso (cancelado por admin):$WAIT_OUT" \
            "Detener servicio:$STOP_OUT" \
            "Transferir JAR:$TRANSFER_OUT" \
            "Fijar datasource:$DS_OUT" \
            "Iniciar servicio:$START_OUT" \
            "Verificar servicio:$VERIFY_OUT"
          do
            nombre="${par%%:*}"
            estado="${par##*:}"
            if [ "$estado" = "failure" ] || [ "$estado" = "cancelled" ]; then
              DEPLOY_OK=false
              PASO_FALLIDO="$nombre"
            fi
          done
          if [ "${{ job.status }}" != "success" ]; then
            DEPLOY_OK=false
          fi
          # Si el build ni corrió o quedó skipped tras un fallo previo, no reportar éxito
          if [ "$BUILD_OUT" != "success" ]; then
            DEPLOY_OK=false
            [ "$PASO_FALLIDO" = "-" ] && PASO_FALLIDO="Build JAR"
          fi

          if [ "$DEPLOY_OK" = true ]; then
            EMOJI="✅"; COLOR=3066993; TITULO="Deploy exitoso"
          else
            EMOJI="❌"; COLOR=15158332; TITULO="Deploy fallido"
          fi

          ERR_LOG=$(tail -c 3000 /tmp/deploy.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g')
          [ -z "$ERR_LOG" ] && ERR_LOG="(sin logs capturados)"

          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_CORTO="${{ github.sha }}"
          COMMIT_CORTO="${COMMIT_CORTO:0:7}"

          if [ "$DEPLOY_OK" = true ]; then
            PAYLOAD=$(jq -n \
              --arg titulo "$EMOJI $TITULO — ${{ github.repository }}" \
              --arg url "$RUN_URL" \
              --argjson color $COLOR \
              --arg rama "${{ github.ref_name }}" \
              --arg commit "$COMMIT_CORTO" \
              --arg commiturl "$COMMIT_URL" \
              --arg autor "${{ github.actor }}" \
              --arg duracion "${MIN}m ${SEC}s" \
              --arg host "${{ env.ENV_LABEL }} ${{ env.HOST }}" \
              '{embeds: [{
                title: $titulo, url: $url, color: $color,
                fields: [
                  {name: "Rama", value: $rama, inline: true},
                  {name: "Duración", value: $duracion, inline: true},
                  {name: "Servidor", value: $host, inline: true},
                  {name: "Autor", value: $autor, inline: true},
                  {name: "Commit", value: ("[`" + $commit + "`](" + $commiturl + ")"), inline: true}
                ],
                timestamp: (now | todate)
              }]}')
          else
            PAYLOAD=$(jq -n \
              --arg titulo "$EMOJI $TITULO — ${{ github.repository }}" \
              --arg url "$RUN_URL" \
              --argjson color $COLOR \
              --arg rama "${{ github.ref_name }}" \
              --arg commit "$COMMIT_CORTO" \
              --arg commiturl "$COMMIT_URL" \
              --arg autor "${{ github.actor }}" \
              --arg paso "$PASO_FALLIDO" \
              --arg err "$ERR_LOG" \
              --arg build "$BUILD_OUT" \
              --arg transfer "$TRANSFER_OUT" \
              --arg verify "$VERIFY_OUT" \
              '{embeds: [{
                title: $titulo, url: $url, color: $color,
                fields: [
                  {name: "Rama", value: $rama, inline: true},
                  {name: "Paso que falló", value: $paso, inline: true},
                  {name: "Autor", value: $autor, inline: true},
                  {name: "Commit", value: ("[`" + $commit + "`](" + $commiturl + ")"), inline: false},
                  {name: "Outcomes", value: ("build=" + $build + " · transfer=" + $transfer + " · verify=" + $verify), inline: false},
                  {name: "Error", value: ("```\n" + ($err | .[0:900]) + "\n```"), inline: false}
                ],
                timestamp: (now | todate)
              }]}')
          fi

          curl -s -H "Content-Type: application/json" -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" -d "$PAYLOAD"
